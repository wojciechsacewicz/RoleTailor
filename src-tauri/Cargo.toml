[package]
name = "roletailor"
version = "0.1.0"
description = "Local CV tailoring desktop application"
authors = ["RoleTailor contributors"]
edition = "2021"

[lib]
name = "roletailor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
scraper = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
walkdir = "2"
which = "8"
url = "2"
regex = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 0
strip = "symbols"
