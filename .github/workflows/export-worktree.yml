name: Verify and publish canvas rebuild

on:
  push:
    branches:
      - feat/canvas-cv-workspace
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: write

jobs:
  verify-build-and-squash:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/canvas-cv-workspace

      - name: Reconstruct the reviewed rebuild
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/rebuild-payload/part-* > /tmp/roletailor-rebuild.b64
          base64 --decode /tmp/roletailor-rebuild.b64 > /tmp/roletailor-rebuild.tar.gz
          echo "6a3ea455e2ff75d3fefad00aa310dc1ec06350fb11742aeddf047c91aed53dda  /tmp/roletailor-rebuild.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/roletailor-rebuild.tar.gz
          rm -rf .github/rebuild-payload
          rm -f .github/rebuild-trigger
          rm .github/workflows/export-worktree.yml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify frontend and shared canvas model
        run: |
          npm run build
          npm test -- --run
          npm run lint

      - name: Verify Rust backend
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build audited desktop release
        env:
          NO_STRIP: "1"
        run: npm run tauri:build

      - name: Record AppImage checksum
        run: |
          sha256sum src-tauri/target/release/bundle/appimage/RoleTailor_0.1.0_amd64.AppImage | tee /tmp/RoleTailor.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RoleTailor-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/RoleTailor_0.1.0_amd64.AppImage
            /tmp/RoleTailor.AppImage.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Squash verified rebuild into one commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git reset --soft origin/main
          git commit -m "feat: rebuild CV editor as shared canvas workspace"
          git push --force origin HEAD:feat/canvas-cv-workspace
